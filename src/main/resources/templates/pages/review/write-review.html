<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>리뷰 작성</title>
  </head>
  <style>
    .star-rating {
      display: flex;
    }

    .star {
      appearance: none;
      padding: 1px;
    }

    .star::after {
      content: "☆";
      color: hsl(60, 80%, 45%);
      font-size: 20px;
    }

    .star:hover::after,
    .star:has(~ .star:hover)::after,
    .star.active::after,
    .star:has(~ .star.active)::after {
      content: "★";
    }

    .star:hover ~ .star::after {
      content: "☆";
    }
  </style>
  <body>
    <header th:replace="~{fragments/global-header::globalHeader}"></header>

    <h1>Write Review</h1>

    <main>
      <article>
        <form>
          <p>장소이름</p>
          <p>작성자</p>
          <div class="star-rating">
            <input type="radio" class="star" value="1" />
            <input type="radio" class="star" value="2" />
            <input type="radio" class="star" value="3" />
            <input type="radio" class="star" value="4" />
            <input type="radio" class="star" value="5" />
            <span>
              <input
                type="password"
                id="password"
                placeholder="비밀번호"
                required />
              <label for="password"></label>
            </span>
          </div>
          <textarea id="textarea" required></textarea>
          <label for="textarea"></label>
          <div><a href="#">이미지추가</a></div>
          <div>
            <a href="#">취소</a>
            <button type="submit">등록</button>
          </div>
        </form>
      </article>
    </main>
    <footer th:replace="~{fragments/global-footer::globalFooter}"></footer>
  </body>
  <script>
    //별점 기능
    document.querySelectorAll(".star").forEach((star) => {
      star.addEventListener("click", ({ target }) => {
        //모든 .star의 .active 삭제
        document.querySelectorAll(".star").forEach((star) => {
          star.classList.remove("active");
        });
        //클릭한 .star의 .active 추가
        target.classList.add("active");
      });
    });
  </script>
</html>
