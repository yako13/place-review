<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/blocks/global-head-block::global-head-block"></th:block>
    <title>나의 계정</title>
</head>
<body>
<header th:replace="~{fragments/global-header::globalHeader}"></header>
<main>
    <form th:action="@{/sign-out}" th:method="post">
        <button type="submit">로그아웃</button>
    </form>
    <form th:action="@{/my-account}" th:method="post">
        <h2>정보수정</h2>
        <div>
            <label for="nickname">닉네임</label>
            <input th:value="${nickname}" type="text" name="nickname" id="nickname" placeholder="닉네임"/>
        </div>
        <div>
            <div>
                <label for="email">이메일</label>
                <input th:value="${email}" type="email" name="email" id="email" placeholder="이메일">
                <button id="email-verification-btn" type="button">인증</button>
            </div>
            <div id="email-verification-code-con" hidden="hidden">
                <label for="email-verification-code">인증번호</label>
                <input type="text" id="email-verification-code" placeholder="인증번호 입력">
                <button id="email-verification-code-btn" type="button">확인</button>
            </div>
        </div>
        <div>
            <label for="password">비밀번호</label>
            <input type="password" name="password" id="password" placeholder="비밀번호"/>
        </div>
        <div>
            <label for="password__check">비밀번호 확인</label>
            <input type="password" id="password__check" placeholder="비밀번호 확인">
        </div>
        <div>
            <button type="submit">수정하기</button>
        </div>
        <div>
            <button type="button">뒤로가기</button>
        </div>
    </form>
    <div>
        <a th:href="@{/my-account/cancel}">계정삭제</a>
    </div>
</main>
<footer th:replace="~{fragments/global-footer::globalFooter}"></footer>
<script th:src="@{/assets/js/email-verification.js}"></script>
</body>
</html>
