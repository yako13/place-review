<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>로그인</title>
    <th:block th:replace="fragments/blocks/global-head-block::global-head-block"></th:block>
    <link rel="stylesheet" th:href="@{/assets/css/form-control.css}">
    <link rel="stylesheet" th:href="@{/assets/css/social-login.css}">
</head>
<body>
<header th:replace="~{fragments/global-header::globalHeader}"></header>
<main class="bg-grey-1 py-3">
    <div th:if="${errorMessage}">
        <h3 th:text="${errorMessage}"></h3>
    </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-10 col-sm-10 col-md-8 col-lg-6 col-xl-4 bg-white rounded-1 p-3">
                <div class="row mb-4">
                    <div>
                        <ul class="social-login">
                            <li class="social-login__item">
                                <a th:href="@{/oauth2/authorization/google}" class="social-login__link">
                                    <img th:src="@{/assets/images/logo/btn_google.svg}" alt="Google logo"
                                         class="social-login__logo">
                                    <span class="social-login__text">Google Login</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
                <form th:action="@{/sign-in}" th:method="post">
                    <div class="row form-item my-3">
                        <div class="mb-2">
                            <label for="email" class="form-item__label">이메일</label>
                        </div>
                        <div>
                            <input type="email" name="email" id="email" class="form_item__input">
                        </div>
                    </div>
                    <div class="row form-item my-3">
                        <div class="mb-2">
                            <label for="password" class="form-item__label">비밀번호</label>
                        </div>
                        <div>
                            <input type="password" name="password" id="password" class="form_item__input">
                        </div>
                    </div>
                    <div class="row my-3">
                        <div class="my-2">
                            <p><a th:href="@{/find/account}" class="link">계정 찾기</a></p>
                        </div>
                        <div class="my-2">
                            <p>아직 회원이 아니시라면? <a th:href="@{/sign-up}" class="link">회원가입</a></p>
                        </div>
                    </div>
                    <div class="row g-0">
                            <button type="submit" class="primary-btn">로그인</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/global-footer::globalFooter}"></footer>
</body>
</html>
