spring.application.name=playground
spring.mvc.hiddenmethod.filter.enabled=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
# Mysql username
spring.datasource.username=${DB_USERNAME}
# Mysql password
spring.datasource.password=${DB_PASSWORD}
# create, update, validate, none
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=500MB
server.servlet.session.tracking-modes=cookie
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
# SMTP \uC11C\uBC84 \uD638\uC2A4\uD2B8, \uAD6C\uAE00 SMTP \uC11C\uBC84
spring.mail.host=smtp.gmail.com
# SMTP \uC11C\uBC84 \uD3EC\uD2B8, \uAD6C\uAE00 SMTP \uC11C\uBC84 \uC811\uC18D \uD3EC\uD2B8
spring.mail.port=587
# SMTP \uC11C\uBC84 \uB85C\uADF8\uC778 \uACC4\uC815
spring.mail.username=${MAIL_USERNAME}
# STMP \uC11C\uBC84 \uB85C\uADF8\uC778 \uD328\uC2A4\uC6CC\uB4DC
spring.mail.password=${MAIL_PASSWORD}
# REDIS \uC124\uC815
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
#Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email
#HTTPS
server.port=443
server.ssl.enabled=true
server.ssl.key-store=src/main/resources/bootsecurity.p12
server.ssl.key-store-password=place-review
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bootsecurity
#Redis Session
spring.session.timeout=30m
#Redis\uC5D0 \uC800\uC7A5\uB418\uB294 \uC138\uC158 \uB370\uC774\uD130\uC758 \uD0A4 Prefix(\uC811\uB450\uC0AC)\uB97C \uC9C0\uC815\uD558\uB294 \uC124\uC815
spring.session.redis.namespace=playground:session
