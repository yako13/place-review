spring.application.name=place-review
spring.mvc.hiddenmethod.filter.enabled=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/place_review
# Mysql username
spring.datasource.username=${DB_USERNAME}
# Mysql password
spring.datasource.password=${DB_PASSWORD}
# create, update, validate, none
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=500MB
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=20m
server.port=80
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
# SMTP \uC11C\uBC84 \uD638\uC2A4\uD2B8, \uAD6C\uAE00 SMTP \uC11C\uBC84
spring.mail.host=smtp.gmail.com
# SMTP \uC11C\uBC84 \uD3EC\uD2B8, \uAD6C\uAE00 SMTP \uC11C\uBC84 \uC811\uC18D \uD3EC\uD2B8
spring.mail.port=587
# SMTP \uC11C\uBC84 \uB85C\uADF8\uC778 \uACC4\uC815
spring.mail.username=${MAIL_USERNAME}
# STMP \uC11C\uBC84 \uB85C\uADF8\uC778 \uD328\uC2A4\uC6CC\uB4DC
spring.mail.password=${MAIL_PASSWORD}
# REDIS \uC124\uC815
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
#Google OAuth2
spring.security.oauth2.client.registration.google.client-id = ${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret = ${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope = profile, email